<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pacman Shooter - Game</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
      height: 100%;
    }

    #gameCanvas {
      display: block;
      background-color: #111;
      margin: 0 auto;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    .hud {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 18px;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="hud">
    <span id="score">Score: 0</span>
  </div>

  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Example: simple Pacman circle
    function drawPacman(x, y, radius, angle) {
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.arc(x, y, radius, angle, Math.PI * 2 - angle, false);
      ctx.closePath();
      ctx.fillStyle = 'yellow';
      ctx.fill();
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawPacman(400, 300, 30, 0.3);
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>

</body>
</html>
