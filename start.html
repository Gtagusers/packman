<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pacman Shooter - Start</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom, #0f0f0f, #1c1c1c);
      font-family: 'Arial', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .logo {
      width: 200px;
      height: 200px;
      background: url('logo.png') no-repeat center;
      background-size: contain;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 3em;
      color: #ffcc00;
      text-shadow: 2px 2px 5px #000;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 40px;
      color: #ccc;
    }

    .start-button {
      padding: 15px 30px;
      font-size: 1.2em;
      background-color: #ffcc00;
      color: #000;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    .start-button:hover {
      background-color: #ffaa00;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="logo"></div> <!-- Replace 'logo.png' with your actual logo image path -->
  <h1>Pacman Shooter</h1>
  <p>Ready to blast through the maze?</p>
  <button class="start-button" onclick="window.location.href='/main-game.html'">
    Start Game
  </button>

</body>
</html>
